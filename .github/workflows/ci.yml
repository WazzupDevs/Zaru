name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.0"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  test-integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub Actions job filesystems are isolated; the upstream `build` job's
      # dist/ folders are not inherited. Vitest resolves
      # `@event-fleet/shared-types` via package.json `exports` -> `./dist/...`,
      # so we must build workspace packages here before running tests.
      - name: Build workspace packages
        run: pnpm build
      - name: Integration tests
        run: pnpm --filter @event-fleet/api test:integration

  prod-build-smoke:
    # Catches CJS/ESM regressions and Zod env-validation failures that the
    # Vitest-based integration suite cannot see (Vitest is ESM-native, while
    # `nest start` runs the API through CJS loader). Boots the prod build
    # against a real Postgres + Redis + MinIO and waits for /healthz.
    name: Prod build smoke
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: eventfleet
          POSTGRES_PASSWORD: eventfleet
          POSTGRES_DB: eventfleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventfleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://eventfleet:eventfleet@localhost:5432/eventfleet?schema=public
        run: pnpm prisma migrate deploy --schema prisma/schema.prisma
      - name: Boot API in prod mode and probe /healthz
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://eventfleet:eventfleet@localhost:5432/eventfleet?schema=public
          REDIS_URL: redis://localhost:6379
          # Synthetic secrets — explicitly labelled so accidental copy is obvious.
          JWT_ACCESS_SECRET: ci-smoke-access-secret-not-for-production-use-1234567890ab
          JWT_REFRESH_SECRET: ci-smoke-refresh-secret-not-for-production-use-1234567890
          PII_HMAC_SECRET: ci-smoke-pii-hmac-secret-not-for-production-use-1234567890
          STORAGE_PROVIDER: minio
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY_ID: minioadmin
          STORAGE_SECRET_ACCESS_KEY: minioadmin
          STORAGE_BUCKET: ci-smoke
          STORAGE_PUBLIC_URL: http://localhost:9000/ci-smoke
          PORT: "3000"
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          echo "API pid=$API_PID, waiting for /healthz..."
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/healthz; then
              echo
              echo "API booted successfully on attempt $i"
              kill $API_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "API did not respond on /healthz within 30 seconds"
          kill $API_PID 2>/dev/null || true
          exit 1
